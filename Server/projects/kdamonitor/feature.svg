<!-- ARROWS -->


<!-- Sensors -> Queue -->
<line x1="380"
      y1="405"
      x2="468"
      y2="340"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Queue -> Dispatcher -->
<line x1="595"
      y1="380"
      x2="595"
      y2="428"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Dispatcher -> Log -->
<line x1="520"
      y1="510"
      x2="380"
      y2="598"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Dispatcher -> Device -->
<line x1="670"
      y1="510"
      x2="770"
      y2="598"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Log -> File -->
<line x1="340"
      y1="680"
      x2="340"
      y2="728"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Device -> Client (control path) -->
<polyline points="
770,600
920,600
920,110
640,110"
fill="none"
stroke="#616161"
stroke-width="1.5"
stroke-dasharray="6,6"
marker-end="url(#arrow)"/>


</svg>