<?xml version="1.0" encoding="utf-8"?>
<svg width="100%" viewBox="0 0 900 650" role="img"
xmlns="http://www.w3.org/2000/svg"
style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6"
          orient="auto">
    <path d="M2 1L8 5L2 9"
          fill="none"
          stroke="#616161"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </marker>
</defs>


<!-- Background -->
<rect width="900" height="650" fill="#f8f9fa"/>


<!-- Title -->
<text x="450" y="35"
      text-anchor="middle"
      font-size="22"
      font-weight="600"
      fill="#212121">
KDAMonitor v0.8 Architecture
</text>


<!-- User space label -->
<text x="60" y="90"
      font-size="14"
      font-weight="600"
      fill="#616161">
USER SPACE
</text>


<!-- Client -->
<rect x="330" y="70"
      width="240"
      height="70"
      rx="10"
      fill="#fff3e0"
      stroke="#e65100"
      stroke-width="1.5"/>

<text x="450" y="98"
      text-anchor="middle"
      font-size="16"
      font-weight="600"
      fill="#bf360c">
Client
</text>

<text x="450" y="120"
      text-anchor="middle"
      font-size="12"
      fill="#bf360c">
Basic IOCTL client (current)
</text>



<!-- Kernel boundary -->
<rect x="50" y="170"
      width="800"
      height="380"
      rx="14"
      fill="#e8f5e9"
      stroke="#2e7d32"
      stroke-width="1.5"/>

<text x="75" y="200"
      font-size="14"
      font-weight="700"
      fill="#1b5e20">
KERNEL SPACE
</text>



<!-- Device Object -->
<rect x="120" y="250"
      width="220"
      height="70"
      rx="10"
      fill="#e3f2fd"
      stroke="#1565c0"
      stroke-width="1.5"/>

<text x="230" y="278"
      text-anchor="middle"
      font-size="15"
      font-weight="600"
      fill="#0d47a1">
Device Object
</text>

<text x="230" y="300"
      text-anchor="middle"
      font-size="12"
      fill="#0d47a1">
IOCTL interface
</text>



<!-- Callbacks -->
<rect x="520" y="190"
      width="230"
      height="130"
      rx="10"
      fill="#fff8e1"
      stroke="#f9a825"
      stroke-width="1.5"/>

<text x="635" y="220"
      text-anchor="middle"
      font-size="15"
      font-weight="600"
      fill="#f57f17">
Kernel Sensors
</text>

<text x="635" y="245"
      text-anchor="middle"
      font-size="12"
      fill="#f57f17">
Process monitoring ✓
</text>

<text x="635" y="270"
      text-anchor="middle"
      font-size="12"
      fill="#f57f17">
Image monitoring ✓
</text>

<text x="635" y="295"
      text-anchor="middle"
      font-size="12"
      fill="#f57f17">
Network monitoring ✓
</text>



<!-- Event Queue -->
<rect x="330" y="350"
      width="240"
      height="70"
      rx="10"
      fill="#e8eaf6"
      stroke="#3949ab"
      stroke-width="1.5"/>

<text x="450" y="378"
      text-anchor="middle"
      font-size="15"
      font-weight="600"
      fill="#1a237e">
Event Queue
</text>

<text x="450" y="400"
      text-anchor="middle"
      font-size="12"
      fill="#1a237e">
Ring buffer
</text>



<!-- Log Writer -->
<rect x="330" y="450"
      width="240"
      height="70"
      rx="10"
      fill="#fce4ec"
      stroke="#c2185b"
      stroke-width="1.5"/>

<text x="450" y="478"
      text-anchor="middle"
      font-size="15"
      font-weight="600"
      fill="#880e4f">
Log Writer
</text>

<text x="450" y="500"
      text-anchor="middle"
      font-size="12"
      fill="#880e4f">
Kernel system thread
</text>



<!-- Logs -->
<rect x="330" y="580"
      width="240"
      height="50"
      rx="10"
      fill="#f3e5f5"
      stroke="#7b1fa2"
      stroke-width="1.5"/>

<text x="450" y="610"
      text-anchor="middle"
      font-size="15"
      font-weight="600"
      fill="#4a148c">
logs.jsonl
</text>



<!-- Arrows -->


<!-- Client -> Device -->
<line x1="450"
      y1="140"
      x2="230"
      y2="248"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Callback -> Queue -->
<line x1="635"
      y1="320"
      x2="570"
      y2="350"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Queue -> Writer -->
<line x1="450"
      y1="420"
      x2="450"
      y2="448"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


<!-- Writer -> Logs -->
<line x1="450"
      y1="520"
      x2="450"
      y2="578"
      stroke="#616161"
      stroke-width="1.5"
      marker-end="url(#arrow)"/>


</svg>